name: Build DevGears Image

on:
  push:
    branches:
      - dg/dev
      - dg/**
      - pr/**
  workflow_dispatch:

concurrency:
  group: dg-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dg/dev' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        run: |
          upstream=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          short_sha="${GITHUB_SHA::8}"
          printf 'version=%s-dg-%s\n' "$upstream" "$short_sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dg
          platforms: linux/amd64
          push: true
          tags: ghcr.io/devgears-pro/dg-postiz:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
